<!DOCTYPE html>
<html lang="id">
<head>

<style>
:root{--bg:#fbfaf6;--ink:#1d2b26;--mut:#5b6b64;--line:#cfd8d2;--acc:#0f5c4d;--key:#e6f2ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Atkinson Hyperlegible",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 80px}
header{border-bottom:3px double var(--acc);padding-bottom:14px;margin-bottom:18px;text-align:center}
h1{font-size:1.25rem;margin:0 0 2px;color:var(--acc)}
header p{margin:0;color:var(--mut);font-size:.95rem}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:14px 0;font-size:.95rem}
.meta span{border-bottom:1px dotted var(--mut);padding-bottom:2px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;gap:8px;flex-wrap:wrap;z-index:2;border-bottom:1px solid var(--line)}
button{font:inherit;padding:8px 14px;border:1.5px solid var(--acc);background:#fff;color:var(--acc);border-radius:6px;cursor:pointer}
button:hover,button:focus-visible{background:var(--acc);color:#fff;outline:none}
h2{font-size:1.05rem;margin:28px 0 4px;color:var(--acc)}
.ins{color:var(--mut);font-size:.92rem;margin:0 0 10px}
.q{display:flex;gap:10px;margin:0 0 16px;break-inside:avoid}
.n{min-width:1.9em;font-weight:700}
.b{flex:1}
.b p{margin:0 0 4px}
ol.o{list-style:upper-alpha;margin:0;padding-left:1.4em}
ol.o li{padding-left:.2em}
.ar{font-family:Amiri,"Traditional Arabic",serif;font-size:1.5em;line-height:1.9;direction:rtl;unicode-bidi:isolate;display:inline-block}
.line{border-bottom:1px dotted var(--mut);height:1.6em;margin-top:4px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.mt div{padding:4px 0}
.key{display:none;background:var(--key);border-left:4px solid var(--acc);padding:3px 10px;font-size:.92rem;margin-top:5px}
body.k .key{display:block}
footer{margin-top:30px;color:var(--mut);font-size:.85rem;text-align:center}
@media(max-width:560px){.meta,.mt{grid-template-columns:1fr}}
@media print{.bar{display:none}body{font-size:12pt;background:#fff}main{max-width:none;padding:0}}
.meta label{display:flex;gap:6px}.meta input{flex:1;min-width:0;border:0;border-bottom:1px dotted var(--mut);background:none;font:inherit;color:inherit}
.tx{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
select{font:inherit;padding:2px 4px}li label{cursor:pointer}
.q.ok .b{border-left:4px solid #1f8a4c;padding-left:8px}.q.no .b{border-left:4px solid #b3382c;padding-left:8px}
.fb{font-size:.9rem;font-weight:700}.q.ok .fb{color:#1f7a45}.q.no .fb{color:#b3382c}
.res{background:var(--key);border:2px solid var(--acc);border-radius:8px;padding:12px 16px;margin-top:24px}
details{margin:12px 0}summary{cursor:pointer;color:var(--acc);font-weight:700}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.88rem}td,th{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
</style>
</head>

<script>
const $=s=>document.querySelector(s),LB="ABCDE",P={pg:1,pgk:2,isi:2,mj:2};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rg=n=>[...Array(n).keys()];
let CH,MAP;
function setK(on){document.body.classList.toggle('k',on);$('#tk').textContent=on?'Sembunyikan kunci':'Tampilkan kunci'}
function render(shuf){
 const f=shuf?sh:a=>a.slice();let n=0,base=0;const H=[],TL={};CH={};MAP={};
 const sec=(t,i)=>H.push(`<h2>${t}</h2><p class=ins>${i}</p>`);
 const wrap=(id,ty,body,k)=>{MAP[id]=++n;TL[id]=ty;return `<div class=q id=q${id}><div class=n>${n}.</div><div class=b>${body}<div class=key>Kunci: ${k}</div><div class=fb></div></div></div>`};
 const opts=(id,ty,q,o)=>`<ol class=o>${o.map((k,p)=>`<li><label><input type=${ty} name=a${id} value=${p}> ${q[1][k]}</label></li>`).join('')}</ol>`;
 sec('A. Pilihan Ganda','Pilih satu jawaban yang paling benar!');
 f(rg(PG.length)).forEach(i=>{const q=PG[i],id=base+i,o=f(rg(q[1].length));CH[id]={t:'pg',a:o.indexOf(q[2])};H.push(wrap(id,'Pilihan Ganda',`<p>${q[0]}</p>`+opts(id,'radio',q,o),LB[CH[id].a]))});
 base+=PG.length;
 sec('B. Pilihan Ganda Kompleks','Pilih lebih dari satu jawaban yang benar!');
 f(rg(PGK.length)).forEach(i=>{const q=PGK[i],id=base+i,o=f(rg(q[1].length)),a=q[2].map(k=>o.indexOf(k)).sort();CH[id]={t:'pgk',a};H.push(wrap(id,'PG Kompleks',`<p>${q[0]}</p>`+opts(id,'checkbox',q,o),a.map(x=>LB[x]).join(', ')))});
 base+=PGK.length;
 sec('C. Isian Singkat','Isilah dengan jawaban yang tepat!');
 f(rg(ISI.length)).forEach(i=>{const q=ISI[i],id=base+i;CH[id]={t:'isi',a:q[2]};H.push(wrap(id,'Isian Singkat',`<p>${q[0]}</p><input class=tx name=a${id}>`,q[1]))});
 base+=ISI.length;
 sec('D. Menjodohkan','Pilih huruf di kolom kanan yang cocok dengan pernyataan di kolom kiri!');
 const ro=f(rg(MJO.length));H.push('<div class=mt><div>');
 f(rg(MJ.length)).forEach(i=>{const q=MJ[i],id=base+i,a=ro.indexOf(q[1]);CH[id]={t:'mj',a};H.push(wrap(id,'Menjodohkan',`<p>${q[0]} <select name=a${id}><option value="">–</option>${ro.map((_,p)=>`<option value=${p}>${LB[p]}</option>`).join('')}</select></p>`,LB[a]))});
 H.push('</div><div>'+ro.map((k,p)=>`<div><b>${LB[p]}.</b> ${MJO[k]}</div>`).join('')+'</div></div>');
 base+=MJ.length;
 sec('E. Uraian','Jawablah dengan singkat dan jelas!');
 f(rg(URA.length)).forEach(i=>{const q=URA[i],id=base+i;CH[id]={t:'ura'};H.push(wrap(id,'Uraian',`<p>${q[0]}</p><textarea class=tx rows=3 name=a${id}></textarea>`,`${q[1]} <i>(skor maks. ${q[2]})</i>`))});
 $('#soal').innerHTML=H.join('');$('#hs').innerHTML='';setK(false);
 $('#kt').innerHTML=Object.keys(MAP).sort((x,y)=>MAP[x]-MAP[y]).map(id=>`<tr><td>${MAP[id]}</td><td>${TL[id]}</td><td>${KISI[id][0]}</td><td>${KISI[id][1]}</td></tr>`).join('');
}
function periksa(){
 let s=0,mx=0;const um=URA.reduce((t,q)=>t+q[2],0);
 for(const id in CH){const c=CH[id];if(c.t=='ura')continue;
  const el=$('#q'+id),x=[...el.querySelectorAll('[name=a'+id+']')];let ok=false;
  if(c.t=='pg'){const r=x.find(e=>e.checked);ok=!!r&&+r.value==c.a}
  else if(c.t=='pgk')ok=x.filter(e=>e.checked).map(e=>+e.value).sort().join()==c.a.join();
  else if(c.t=='isi'){const v=x[0].value.toLowerCase();ok=!!v.trim()&&c.a.some(k=>v.includes(k))}
  else ok=x[0].value!==''&&+x[0].value==c.a;
  mx+=P[c.t];if(ok)s+=P[c.t];
  el.classList.remove('ok','no');el.classList.add(ok?'ok':'no');
  el.querySelector('.fb').textContent=ok?'Benar (+'+P[c.t]+')':'Belum tepat (0)';
 }
 setK(true);
 $('#hs').innerHTML=`<div class=res><b>Skor otomatis: ${s} / ${mx}</b> · Nilai ${Math.round(s/mx*100)}<br>Bobot: PG 1, PG Kompleks 2 (harus lengkap), Isian 2, Menjodohkan 2. Soal uraian (maks. ${um}) dinilai guru dengan kunci di atas.</div>`;
 $('#hs').scrollIntoView({behavior:'smooth'});
}
